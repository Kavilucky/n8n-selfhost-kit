<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Локальный AI-ассистент по документам</title>
<style>
  :root { --bg:#070a10; --win:#0d1220; --bar:#111830; --line:#24304a; --tx:#eaf1ff; --mut:#8a97b3; --blue:#4da3ff; --ok:#3ddc97; --err:#ff5d6c; --neon:#d6ff3a; }
  * { box-sizing: border-box; }
  body { margin:0; background:radial-gradient(1200px 800px at 50% 0, #101c34, var(--bg) 62%); color:var(--tx); font:16px "Segoe UI", Inter, system-ui, sans-serif; min-height:100vh; }
  header { display:flex; align-items:center; gap:16px; padding:16px 28px; border-bottom:1px solid var(--line); background:var(--bar); flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; }
  .pill { font:600 14px "Cascadia Mono", Consolas, monospace; padding:6px 14px; border-radius:999px; border:1.5px solid var(--ok); color:var(--ok); background:rgba(61,220,151,.08); }
  main { display:grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap:20px; padding:20px 28px; height:calc(100vh - 66px); }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); height:auto; } }
  .win { background:var(--win); border:1px solid var(--line); border-radius:18px; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .win h2 { margin:0; padding:12px 18px; font-size:15px; color:var(--mut); background:var(--bar); border-bottom:1px solid var(--line); font-weight:600; }
  #drop { margin:16px; padding:26px; border:3px dashed #2d4a7a; border-radius:16px; text-align:center; color:var(--mut); cursor:pointer; transition:.15s; }
  #drop.over { border-color:var(--blue); background:rgba(77,163,255,.1); color:var(--tx); }
  #drop b { display:block; color:var(--tx); font-size:18px; margin-bottom:4px; }
  #info { margin:0 16px 8px; font:14px "Cascadia Mono", Consolas, monospace; color:var(--ok); min-height:20px; }
  #chat { flex:1; overflow:auto; padding:8px 16px; display:flex; flex-direction:column; gap:12px; }
  .m { padding:12px 16px; border-radius:16px; line-height:1.45; white-space:pre-wrap; max-width:92%; }
  .u { align-self:flex-end; background:#1c3a66; border:1px solid #2d5ea3; }
  .a { background:#111a2c; border:1px solid var(--line); }
  .src { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .src button { font:600 13px "Cascadia Mono", Consolas, monospace; padding:5px 12px; border-radius:10px; border:1.5px solid #2d4a7a; background:#14213d; color:var(--blue); cursor:pointer; }
  .src button:hover { border-color:var(--neon); color:var(--neon); }
  form { display:flex; gap:10px; padding:14px 16px; border-top:1px solid var(--line); }
  input[type=text] { flex:1; padding:12px 16px; border-radius:14px; border:2px solid var(--line); background:#0a0f1c; color:var(--tx); font-size:16px; }
  input[type=text]:focus { outline:none; border-color:var(--blue); }
  button.go { padding:0 22px; border:0; border-radius:14px; background:var(--blue); color:#06101f; font-weight:700; font-size:16px; cursor:pointer; }
  button.go:disabled { opacity:.5; cursor:wait; }
  #viewer { flex:1; overflow:auto; padding:14px; min-height:240px; }
  #pg { position:relative; display:none; width:100%; max-width:952px; margin:0 auto; }
  #pg img { display:block; width:100%; height:auto; background:#fff; border-radius:6px; }
  #mk { position:absolute; border-radius:6px; background:rgba(214,255,58,.35); box-shadow:0 0 22px 5px rgba(214,255,58,.55), inset 0 0 0 2px rgba(214,255,58,.95); pointer-events:none; display:none; }
  #empty { color:var(--mut); padding:40px 20px; text-align:center; }
  .err { color:var(--err); }
  .tag { color:var(--mut); font:13px "Cascadia Mono", Consolas, monospace; margin-top:6px; }
</style>
</head>
<body>
<header><h1>Локальный AI-ассистент по документам</h1><span class="pill">100% офлайн · 0 ₽</span><span class="pill" id="model" style="border-color:var(--blue);color:var(--blue);background:rgba(77,163,255,.08)">модель…</span></header>
<main>
  <section class="win">
    <h2>Документ и диалог</h2>
    <div id="drop"><b>Перетащите PDF сюда</b>или нажмите, чтобы выбрать файл. Файл не покидает компьютер.<input id="file" type="file" accept="application/pdf" hidden></div>
    <div id="info"></div>
    <div id="chat"></div>
    <form id="f"><input type="text" id="q" placeholder="Например: какой залог и какие штрафы?" autocomplete="off" disabled><button class="go" id="go" disabled>Спросить</button></form>
  </section>
  <section class="win">
    <h2 id="vt">Документ</h2>
    <div id="viewer"><div id="empty">Здесь появится страница документа с подсвеченным найденным местом.</div>
      <div id="pg"><img id="img" alt=""><div id="mk"></div></div></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let ready = false, docName = "Документ";
fetch("/status").then(r => r.json()).then(s => { $("model").textContent = s.model; });

const drop = $("drop"), file = $("file");
drop.onclick = () => file.click();
["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => { if (ev.dataTransfer.files[0]) upload(ev.dataTransfer.files[0]); });
file.onchange = () => { if (file.files[0]) upload(file.files[0]); };

async function upload(f) {
  $("info").className = ""; $("info").textContent = "Читаю и индексирую…";
  const r = await fetch("/upload", { method: "POST", headers: { "X-Filename": encodeURIComponent(f.name) }, body: f });
  const j = await r.json();
  if (!r.ok) { $("info").className = "err"; $("info").textContent = j.error; return; }
  $("info").textContent = "Проиндексировано: " + j.pages + " стр. · " + j.chunks + " фрагментов · " + String(j.seconds).replace(".", ",") + " с";
  docName = j.name; ready = true; $("q").disabled = false; $("go").disabled = false; $("q").focus();
  showPage(1, null);
}

async function showPage(n, bbox) {
  const r = await fetch("/page?n=" + n);
  const size = r.headers.get("X-Page-Size").split(",").map(Number);
  const blob = await r.blob(), img = $("img");
  await new Promise(res => { img.onload = res; img.src = URL.createObjectURL(blob); });
  $("empty").style.display = "none"; $("pg").style.display = "block"; $("vt").textContent = docName + " · стр. " + n;
  const mk = $("mk");
  if (bbox) {
    const pc = (v, t) => (v / t * 100) + "%";
    Object.assign(mk.style, { display: "block", left: pc(bbox[0], size[0]), top: pc(bbox[1], size[1]),
      width: pc(bbox[2] - bbox[0], size[0]), height: pc(bbox[3] - bbox[1], size[1]) });
    mk.scrollIntoView({ block: "center", behavior: "smooth" });
  } else mk.style.display = "none";
}

$("f").onsubmit = async ev => {
  ev.preventDefault();
  const q = $("q").value.trim(); if (!q || !ready) return;
  $("q").value = ""; $("go").disabled = true;
  const chat = $("chat");
  const u = document.createElement("div"); u.className = "m u"; u.textContent = q; chat.appendChild(u);
  const a = document.createElement("div"); a.className = "m a"; a.textContent = "Ищу по документу…"; chat.appendChild(a);
  const t0 = performance.now(); let first = true, srcs = [];
  const r = await fetch("/ask", { method: "POST", body: JSON.stringify({ question: q }) });
  const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { value, done } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n"); buf = lines.pop();
    for (const ln of lines) {
      if (!ln) continue;
      const o = JSON.parse(ln);
      if (o.sources) srcs = o.sources;
      if (o.token) { if (first) { a.textContent = ""; first = false; } a.textContent += o.token; chat.scrollTop = chat.scrollHeight; }
      if (o.error) { a.className = "m a err"; a.textContent = o.error; }
      if (o.done) { const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = "ответ за " + ((performance.now() - t0) / 1000).toFixed(1).replace(".", ",") + " с"; a.appendChild(tag); }
    }
  }
  if (srcs.length) {
    const box = document.createElement("div"); box.className = "src";
    srcs.forEach(s => { const b = document.createElement("button"); b.textContent = "стр. " + s.page + (s.num ? " · п. " + s.num.replace(/\.$/, "") : ""); b.onclick = () => showPage(s.page, s.bbox); box.appendChild(b); });
    a.appendChild(box); showPage(srcs[0].page, srcs[0].bbox);
  }
  $("go").disabled = false; chat.scrollTop = chat.scrollHeight;
};
</script>
</body>
</html>
