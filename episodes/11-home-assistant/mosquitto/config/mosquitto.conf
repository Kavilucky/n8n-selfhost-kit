# Mosquitto 2.x: по умолчанию слушает только локальный адрес и не пускает анонимных клиентов.
# Здесь слушаем порт 1883 для Zigbee2MQTT и Home Assistant, вход только по логину и паролю из файла passwd.
# Файл passwd создаётся ДО первого запуска (Инструкция.txt, раздел 3), иначе брокер не стартует.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
