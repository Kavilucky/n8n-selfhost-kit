# Zigbee2MQTT: файл должен быть доступен на запись (программа дописывает в него сгенерированные ключи и список устройств).
# Логин и пароль MQTT подставляются из .env через переменные окружения (см. docker-compose.yml).
homeassistant:
  enabled: true
mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://mosquitto:1883
serial:
  # Путь внутри контейнера; настоящий USB-координатор пробрасывается в docker-compose.yml (devices).
  port: /dev/ttyACM0
  # Если ваш адаптер не определяется сам, укажите тип по странице адаптера в документации Zigbee2MQTT, например:
  # adapter: ember
frontend:
  enabled: true
  port: 8080
  # Рекомендуется включить пароль на веб-интерфейс (уберите решётку и поставьте свой):
  # auth_token: ЗАМЕНИТЕ_НА_СВОЙ_ПАРОЛЬ
advanced:
  network_key: GENERATE
  pan_id: GENERATE
  ext_pan_id: GENERATE
