# Home Assistant + Mosquitto + Zigbee2MQTT: локальный умный дом без облаков производителей.
# Собрано по примерам официальной документации (Home Assistant Container, Zigbee2MQTT в Docker, Eclipse Mosquitto).
# Автор не запускал эти контейнеры на железе: см. раздел «Что проверено» в Инструкция.txt.
# Перед запуском: скопируйте env.example в .env и впишите свои значения; создайте пользователей Mosquitto (Инструкция.txt, раздел 3).
services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    stop_grace_period: 60s
    privileged: true
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      - mosquitto

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2.1-alpine
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: ghcr.io/koenkk/zigbee2mqtt
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Moscow}
      ZIGBEE2MQTT_CONFIG_MQTT_USER: ${MQTT_ZIGBEE_USER:?укажите MQTT_ZIGBEE_USER в файле .env}
      ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: ${MQTT_ZIGBEE_PASSWORD:?укажите MQTT_ZIGBEE_PASSWORD в файле .env}
    devices:
      - ${ZIGBEE_DEVICE:?укажите путь к координатору ZIGBEE_DEVICE в файле .env}:/dev/ttyACM0
